  # ==========================================
  # 🗺️ Geo
  # ==========================================
  /api/geo/city:
    get:
      summary: Look up a city's boundary polygon (for map display)
      description: |
        Proxies OpenStreetMap Nominatim and caches results in-memory per server instance.
        Returns `null` (not a 404) when no boundary is found or the name is missing.
      tags: [Geo]
      security: []
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          example: Budapest
        - name: country
          in: query
          required: false
          schema:
            type: string
          example: Hungary
      responses:
        '200':
          description: A GeoJSON Polygon/MultiPolygon feature, or null if not found
          content:
            application/json:
              schema:
                type: object
                nullable: true

  /api/geo/country:
    get:
      summary: Look up a country's boundary polygon (for map display)
      description: Same caching/proxy behavior as /api/geo/city, keyed by country name only.
      tags: [Geo]
      security: []
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          example: Hungary
      responses:
        '200':
          description: A GeoJSON Polygon/MultiPolygon feature, or null if not found
          content:
            application/json:
              schema:
                type: object
                nullable: true

  # ==========================================
  # 🚗 Routing
  # ==========================================
  /api/route/transit:
    get:
      summary: Public-transit routing between two points
      description: Proxies the Transitous public-transit journey planner. Query params are forwarded as-is.
      tags: [Routing]
      security: []
      responses:
        '200':
          description: Transitous journey plan response (passed through)
          content:
            application/json:
              schema:
                type: object
        '503':
          description: Transit service unavailable or timed out

  /api/route/valhalla:
    get:
      summary: Walking or driving route between two points
      description: |
        Despite the route name, this proxies OSRM (routing.openstreetmap.de), not Valhalla —
        the public Valhalla demo instance was unreliable. Returns a GeoJSON route geometry.
      tags: [Routing]
      security: []
      parameters:
        - name: fromLat
          in: query
          required: true
          schema:
            type: string
        - name: fromLng
          in: query
          required: true
          schema:
            type: string
        - name: toLat
          in: query
          required: true
          schema:
            type: string
        - name: toLng
          in: query
          required: true
          schema:
            type: string
        - name: mode
          in: query
          required: true
          schema:
            type: string
            enum: [walk, car]
      responses:
        '200':
          description: OSRM route response (passed through)
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Missing required query params
        '503':
          description: Routing service unavailable or timed out
