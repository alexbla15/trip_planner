openapi: 3.0.0
info:
  title: Trip & Attraction Planner API
  version: 1.0.0
  description: API documentation for the Trip Management and Attraction Tracking Platform.
servers:
  - url: https://trip-planner-beta-dusky.vercel.app
    description: Production (Vercel)
  - url: http://localhost:3000
    description: Local development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT token to access protected endpoints.

  schemas:
    # --- USER SCHEMAS ---
    UserRegisterInput:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          example: SecureP@ss123

    UserLoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          example: SecureP@ss123

    UserProfile:
      type: object
      properties:
        _id:
          type: string
          example: 65f1234567890abcdef12345
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        avatarUrl:
          type: string
          example: https://example.com
        createdAt:
          type: string
          format: date-time

    UserUpdateInput:
      type: object
      properties:
        name:
          type: string
          example: John Smith
        avatarUrl:
          type: string
          example: https://example.com

    # --- TRIP SCHEMAS ---
    TripCollaborator:
      type: object
      properties:
        userId:
          type: string
          example: 65f1234567890abcdef12345
        email:
          type: string
          format: email
          example: jane@example.com
        name:
          type: string
          example: Jane Smith

    Trip:
      type: object
      properties:
        _id:
          type: string
          example: 65f1234567890abcdef123aa
        ownerId:
          type: string
          example: 65f1234567890abcdef12345
        name:
          type: string
          example: Summer in Rome
        cities:
          type: array
          nullable: true
          items:
            type: string
          example: ["Rome", "Florence"]
        country:
          type: string
          example: Italy
        coverImage:
          type: string
          example: https://example.com
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        budget:
          type: number
          example: 2500
        currency:
          type: string
          example: EUR
        moods:
          type: array
          items:
            type: string
          example: ["Adventure", "Food & Wine"]
        notes:
          type: string
          example: Don't forget to book the Colosseum tickets in advance.
        attractionIds:
          type: array
          items:
            type: string
          example: ["65f1234567890abcdef123bb"]
        collaborators:
          type: array
          description: Users invited by the owner to co-edit this trip.
          items:
            $ref: '#/components/schemas/TripCollaborator'
        isPrivate:
          type: boolean
          default: false
          description: When true, the trip is visible only to the owner and collaborators.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TripInput:
      type: object
      required:
        - name
        - country
        - startDate
        - endDate
      properties:
        name:
          type: string
          example: Summer in Rome
        cities:
          type: array
          nullable: true
          items:
            type: string
        country:
          type: string
          example: Italy
        coverImage:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        budget:
          type: number
        currency:
          type: string
        moods:
          type: array
          items:
            type: string
        notes:
          type: string
        isPrivate:
          type: boolean
          description: Set to true to restrict visibility to owner and collaborators only.
        collaboratorEmails:
          type: array
          items:
            type: string
          description: |
            Registered users' emails to set as collaborators. On POST /api/trips, resolves each
            email to a user and seeds the trip's collaborators at creation (unknown emails are
            skipped silently). On PUT /api/trips/{id}, replaces the entire collaborators list —
            owner-only, silently ignored if sent by a non-owner collaborator. Prefer the dedicated
            /api/trips/{id}/collaborators endpoints for single add/remove operations; this field
            is meant for the create/edit forms which batch all pending changes into one request.

    # --- ATTRACTION SCHEMAS ---
    OpeningHoursRange:
      type: object
      properties:
        open:
          type: string
          example: "09:00"
        close:
          type: string
          example: "18:00"

    OpeningHoursDay:
      type: object
      properties:
        closed:
          type: boolean
        ranges:
          type: array
          description: One or more open/close windows for this day (e.g. a lunch break splits the day into two ranges). A closing time earlier than its opening time is interpreted as spanning past midnight.
          items:
            $ref: '#/components/schemas/OpeningHoursRange'

    # Trip-specific scheduling for one attraction
    AttractionSchedule:
      type: object
      properties:
        plannedDate:
          type: string
          format: date
          nullable: true
          description: Day the user plans to visit (stored in Trip.schedules, not on Attraction)
        plannedTime:
          type: string
          nullable: true
          description: HH:MM start time within plannedDate
        actualDurationValue:
          type: string
          nullable: true
        actualDurationUnit:
          type: string
          enum: [minutes, hours]
          nullable: true
        checkInDate:
          type: string
          format: date
          nullable: true
          description: >
            Per-trip check-in date override for a shared residence Attraction document
            (stored in Trip.schedules, not on Attraction). Set when POST /api/trips/{id}/attractions
            links an existing residence via existingAttractionId, so reusing the same residence
            across multiple trips never overwrites another trip's stay dates. Falls back to the
            Attraction document's own checkInDate when no override exists.
        checkOutDate:
          type: string
          format: date
          nullable: true
          description: Per-trip check-out date override — see checkInDate.
        price:
          type: number
          nullable: true
          description: Per-trip price override — same rationale as checkInDate.
        currency:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        attractionRef:
          type: string
          nullable: true
          description: >
            Set only on a 2nd+ scheduled instance of a regular attraction — the shared
            Attraction document's real id. The Trip.schedules map key for such an entry is a
            fresh synthetic id (at-<objectId>), not the attraction's own id, so multiple
            instances of the same attraction can each hold independent plannedDate/plannedTime.
            The primary/first instance is unchanged: its schedule key IS the attraction's own
            id, and this field is absent.

    Attraction:
      type: object
      description: >
        Global shared entity — not owned by any single trip.
        Scheduling fields (plannedDate, plannedTime, actualDuration) come from
        Trip.schedules and are merged into the response by GET /api/trips/:id/attractions.
      properties:
        _id:
          type: string
          description: >
            Identifies this row. For a regular attraction's 2nd+ scheduled instance (see
            AttractionSchedule.attractionRef), this is a synthetic per-instance id
            (`at-<objectId>`), not the shared document's own id — see attractionId. For
            every other case (primary instance, unscheduled linked attraction, custom-slot,
            flight) this equals the "real" id for that row, unchanged from before this field
            existed.
          example: 65f1234567890abcdef123bb
        attractionId:
          type: string
          nullable: true
          description: >
            The shared Attraction document's real id. Always present for a regular attraction
            (whether the primary instance or an additional one), absent for custom-slot/flight
            rows (which have no backing document). Use this — not _id — when editing the
            shared document itself (PATCH /api/attractions/{id}) once more than one instance
            can exist.
          example: 65f1234567890abcdef123bb
        isVisited:
          type: boolean
          default: false
          description: >
            Whether the REQUESTING user has personally marked this attraction visited — a
            private, per-user fact merged onto the response at read time (never stored on
            the Attraction document itself, since it's shared across users/trips). Always
            false for an unauthenticated caller. Toggle via PUT/DELETE
            /api/users/me/visited/{attractionId}.
        usedInTripNames:
          type: array
          items: { type: string }
          default: []
          description: >
            Names of the REQUESTING user's own trips that already include this attraction —
            a private, per-user fact merged onto the response at read time (never stored on
            the Attraction document itself, since it's shared across users/trips). Always
            empty for an unauthenticated caller.
          example: ["Summer in Budapest"]
        parentAttractionId:
          type: string
          nullable: true
          description: >
            The shared Attraction document this one is nested inside (e.g. a restaurant
            inside a mall) — one level of nesting only, a child can never itself be a
            parent. null/absent means this attraction isn't nested inside anything. When
            set, coordinates/city/country are inherited from the parent, not independently
            editable via this attraction's own PUT.
          example: 65f1234567890abcdef123cc
        parentAttractionName:
          type: string
          description: The parent's name — present only when parentAttractionId is set.
          example: Westfield Mall
        childAttractionCount:
          type: integer
          default: 0
          description: How many other attractions are nested inside this one.
          example: 3
        ownerId:
          type: string
          example: 65f1234567890abcdef12345
        name:
          type: string
          example: Colosseum
        country:
          type: string
          example: Italy
        city:
          type: string
          example: Rome
        coordinates:
          type: object
          nullable: true
          properties:
            lat:
              type: number
              example: 41.8902
            lng:
              type: number
              example: 12.4922
        types:
          type: array
          items:
            type: string
          example: ["Museum", "Historical Site"]
        durationValue:
          type: string
          example: "2"
        durationUnit:
          type: string
          enum: [minutes, hours]
          example: hours
        price:
          type: number
          nullable: true
          example: 16.00
        currency:
          type: string
          default: USD
          description: ISO 4217 currency code for the price field.
          example: EUR
        openingHours:
          type: object
          properties:
            Mon: { $ref: '#/components/schemas/OpeningHoursDay' }
            Tue: { $ref: '#/components/schemas/OpeningHoursDay' }
            Wed: { $ref: '#/components/schemas/OpeningHoursDay' }
            Thu: { $ref: '#/components/schemas/OpeningHoursDay' }
            Fri: { $ref: '#/components/schemas/OpeningHoursDay' }
            Sat: { $ref: '#/components/schemas/OpeningHoursDay' }
            Sun: { $ref: '#/components/schemas/OpeningHoursDay' }
        openingMonths:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 12
          nullable: true
          description: Months (1-12) this attraction is open in. Absent/empty means open year-round.
          example: [3, 4, 5, 6, 7, 8, 9]
        notes:
          type: string
          nullable: true
          example: Book tickets in advance.
        photoUrl:
          type: string
          nullable: true
          example: https://example.com/photo.jpg
        websiteUrl:
          type: string
          nullable: true
          description: Official venue website, set by the attraction's owner or backfilled from a verified source. Absent when no real official site exists for the place.
          example: https://www.louvre.fr
        plannedDate:
          type: string
          nullable: true
          description: ISO date the traveler plans to visit (YYYY-MM-DD), set by the calendar wizard.
          example: "2025-07-15"
        plannedTime:
          type: string
          nullable: true
          description: Start time within plannedDate (HH:MM), e.g. 09:30.
          example: "09:30"
        actualDurationValue:
          type: string
          nullable: true
          description: Traveler's planned duration (distinct from the recommended durationValue).
          example: "2.5"
        actualDurationUnit:
          type: string
          nullable: true
          enum: [minutes, hours]
          example: hours
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        # --- Subtype discriminator ---
        subtype:
          type: string
          nullable: true
          enum: [residence, flight, custom-slot]
          description: Distinguishes special attraction types from generic ones. Absent for regular attractions.
        # --- Residence-specific fields (present when subtype = "residence") ---
        residenceType:
          type: string
          nullable: true
          enum: [Hotel, Apartment, Hostel, Villa, Other]
          example: Hotel
        checkInDate:
          type: string
          nullable: true
          format: date
          description: >
            Check-in date (YYYY-MM-DD). Must fall within the trip's start/end dates. When this
            attraction was linked to a trip via existingAttractionId, this reflects that trip's
            own schedule-entry override (see AttractionSchedule) rather than necessarily the
            value stored on the document itself — the same shared residence can show different
            dates on different trips.
          example: "2026-07-04"
        checkOutDate:
          type: string
          nullable: true
          format: date
          description: Check-out date (YYYY-MM-DD). Must be ≥ checkInDate and ≤ trip end date. Same per-trip override behavior as checkInDate.
          example: "2026-07-08"
        # --- Flight-specific fields (present when subtype = "flight") ---
        flightNumber:
          type: string
          nullable: true
          example: BA2490
        airline:
          type: string
          nullable: true
          example: British Airways
        departureAirport:
          type: string
          nullable: true
          example: LHR
        arrivalAirport:
          type: string
          nullable: true
          example: CDG
        departureTime:
          type: string
          nullable: true
          description: Full ISO datetime of departure (YYYY-MM-DDTHH:MM).
          example: "2026-07-04T09:15"
        arrivalTime:
          type: string
          nullable: true
          description: Full ISO datetime of arrival (YYYY-MM-DDTHH:MM). May be next day for overnight flights.
          example: "2026-07-04T11:45"
        gate:
          type: string
          nullable: true
          example: B22
        seat:
          type: string
          nullable: true
          example: 14A

    AttractionInput:
      type: object
      required:
        - name
        - country
        - city
      properties:
        name:
          type: string
        country:
          type: string
        city:
          type: string
        coordinates:
          type: object
          nullable: true
          properties:
            lat: { type: number }
            lng: { type: number }
        parentAttractionId:
          type: string
          nullable: true
          description: >
            Nests this attraction inside another (e.g. a restaurant inside a mall) — one
            level of nesting only (400 if the chosen parent is itself already a child).
            When set, country/city are NOT required in this same request (inherited from
            the parent) — if sent anyway, coordinates/city/country are silently overridden
            by the parent's own values, not rejected. 400 if the parent doesn't exist, or
            if country is also sent in this request and doesn't match the parent's country.
        types:
          type: array
          items: { type: string }
        durationValue:
          type: string
        durationUnit:
          type: string
          enum: [minutes, hours]
        price:
          type: number
          nullable: true
        currency:
          type: string
          default: USD
          description: ISO 4217 currency code for the price field.
          example: EUR
        openingHours:
          type: object
          properties:
            Mon: { $ref: '#/components/schemas/OpeningHoursDay' }
            Tue: { $ref: '#/components/schemas/OpeningHoursDay' }
            Wed: { $ref: '#/components/schemas/OpeningHoursDay' }
            Thu: { $ref: '#/components/schemas/OpeningHoursDay' }
            Fri: { $ref: '#/components/schemas/OpeningHoursDay' }
            Sat: { $ref: '#/components/schemas/OpeningHoursDay' }
            Sun: { $ref: '#/components/schemas/OpeningHoursDay' }
        openingMonths:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 12
          nullable: true
          description: Months (1-12) this attraction is open in. Absent/empty means open year-round.
          example: [3, 4, 5, 6, 7, 8, 9]
        notes:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        websiteUrl:
          type: string
          nullable: true
          description: Official venue website. Omit when no real official site exists for the place — never fabricate one.
        existingAttractionId:
          type: string
          description: >
            When adding to a trip via POST /api/trips/{id}/attractions, links an existing shared
            Attraction document instead of creating a new one (the "pick existing" flow — e.g.
            reusing a residence from an earlier trip). name/country/city/etc. are ignored when
            set. checkInDate/checkOutDate/price/currency/notes are still read from this same
            request body, but are stored as a per-trip schedule override rather than written onto
            the shared document — see AttractionSchedule.
        allowDuplicate:
          type: boolean
          default: false
          description: >
            Only relevant together with existingAttractionId. When the referenced attraction is
            already linked to this trip and allowDuplicate is true, creates an additional
            scheduled instance (its own plannedDate/plannedTime, a fresh synthetic response _id,
            attractionRef pointing back to the shared document) instead of returning the existing
            single instance unchanged (the default, existingAttractionId-only behavior).
        # Subtype fields — include when creating residence, flight, or custom-slot (custom time-slot) entries
        subtype:
          type: string
          enum: [residence, flight, custom-slot]
        residenceType:
          type: string
          enum: [Hotel, Apartment, Hostel, Villa, Other]
        checkInDate:
          type: string
          format: date
        checkOutDate:
          type: string
          format: date
        flightNumber:
          type: string
        airline:
          type: string
        departureAirport:
          type: string
        arrivalAirport:
          type: string
        departureTime:
          type: string
          description: ISO datetime (YYYY-MM-DDTHH:MM)
        arrivalTime:
          type: string
          description: ISO datetime (YYYY-MM-DDTHH:MM)
        gate:
          type: string
        seat:
          type: string
        # Calendar integration — set for flights so the entry appears on the day planner
        plannedDate:
          type: string
          format: date
          description: ISO date (YYYY-MM-DD). Set automatically for flights to the departure date.
        plannedTime:
          type: string
          description: HH:MM start time. Set automatically for flights to the departure time.
        actualDurationValue:
          type: string
          description: Traveler's planned duration. Set automatically for flights (computed from dep→arr times).
          example: "130"
        actualDurationUnit:
          type: string
          enum: [minutes, hours]
          description: Unit for actualDurationValue. Always "minutes" for auto-computed flight durations.

    ReorderInput:
      type: object
      required:
        - attractionIds
      properties:
        attractionIds:
          type: array
          items:
            type: string
          example: ["65f1234567890abcdef123bb", "65f1234567890abcdef123cc"]

    # --- ANALYTICS SCHEMAS ---
    GlobalAnalytics:
      type: object
      properties:
        summary:
          type: object
          properties:
            totalTrips: { type: integer, example: 1240 }
            totalAttractions: { type: integer, example: 5890 }
            uniqueCitiesCovered: { type: integer, example: 142 }
            uniqueCountriesCovered: { type: integer, example: 38 }
            totalPlatformBudget: { type: number, example: 2450000.00 }
            totalPlatformSpent: { type: number, example: 1850300.50 }
        categoryDistribution:
          type: array
          items:
            type: object
            properties:
              _id: { type: string, example: Restaurant }
              count: { type: integer, example: 2100 }
        topUsers:
          type: array
          items:
            type: object
            properties:
              ownerId: { type: string, example: 65f1234567890abcdef12345 }
              attractionsCount: { type: integer, example: 145 }
              countriesCount: { type: integer, example: 12 }

    PersonalAnalytics:
      type: object
      properties:
        summary:
          type: object
          properties:
            totalTrips: { type: integer, example: 14 }
            totalAttractions: { type: integer, example: 42 }
            uniqueCitiesCovered: { type: integer, example: 9 }
            uniqueCountriesCovered: { type: integer, example: 3 }
            totalPersonalBudget: { type: number, example: 8500.00 }
        categoryDistribution:
          type: array
          items:
            type: object
            properties:
              _id: { type: string, example: Restaurant }
              count: { type: integer, example: 18 }
        topCities:
          type: array
          items:
            type: object
            properties:
              _id: { type: string, example: Tokyo }
              count: { type: integer, example: 8 }
              country: { type: string, example: Japan }
              lat: { type: number, example: 35.6762, nullable: true }
              lng: { type: number, example: 139.6503, nullable: true }
        topTrips:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: Japan 2024 }
              tripId: { type: string, example: 65f1234567890abcdef12345 }
              attractionCount: { type: integer, example: 12 }
        topCountries:
          type: array
          items:
            type: object
            properties:
              _id: { type: string, example: Japan }
              count: { type: integer, example: 3 }
        moodDistribution:
          type: array
          items:
            type: object
            properties:
              _id: { type: string, example: Adventure }
              count: { type: integer, example: 5 }
              icon: { type: string, example: Zap }
              color: { type: string, example: "#F59E0B" }

    AttractionType:
      type: object
      description: An attraction type with its category data populated
      properties:
        _id:
          type: string
          example: 65f1234567890abcdef12345
        name:
          type: string
          example: Restaurant
        categoryId:
          type: string
          nullable: true
          description: ID of the linked AttractionCategory (null for unmigrated legacy types)
          example: 65f1234567890abcdef12346
        category:
          type: string
          description: Category name (populated from the linked category)
          example: Food & Drink
        icon:
          type: string
          description: Lucide icon name for the type chip
          example: Utensils
        categoryIcon:
          type: string
          description: Lucide icon name for the category header (from linked category)
          example: UtensilsCrossed
        color:
          type: string
          description: Hex color from the linked category
          example: "#f59e0b"
        subtype:
          type: string
          enum: [flight, residence]
          nullable: true
          description: Distinguishes special types from generic ones

    AttractionTypeInput:
      type: object
      required: [name, categoryId, icon]
      properties:
        name:
          type: string
          example: Restaurant
        categoryId:
          type: string
          description: ID of the AttractionCategory this type belongs to
          example: 65f1234567890abcdef12346
        icon:
          type: string
          example: Utensils
        subtype:
          type: string
          enum: [flight, residence]
          nullable: true

    AttractionCategory:
      type: object
      properties:
        _id:
          type: string
          example: 65f1234567890abcdef12345
        name:
          type: string
          example: Food & Drink
        icon:
          type: string
          description: Lucide icon name for the category header
          example: UtensilsCrossed
        color:
          type: string
          description: Hex color shared by all types in this category
          example: "#f59e0b"

    AttractionCategoryInput:
      type: object
      required: [name, icon, color]
      properties:
        name:
          type: string
          example: Food & Drink
        icon:
          type: string
          example: UtensilsCrossed
        color:
          type: string
          example: "#f59e0b"

    MoodTag:
      type: object
      properties:
        _id:
          type: string
          example: 65f1234567890abcdef12345
        name:
          type: string
          example: Adventure
        icon:
          type: string
          example: Mountain
        color:
          type: string
          example: "#ea580c"
        bgColor:
          type: string
          example: "#fff7ed"
        darkColor:
          type: string
          example: "#fdba74"
        darkBgColor:
          type: string
          example: "#431407"

    MoodTagInput:
      type: object
      required: [name, icon, color, bgColor, darkColor, darkBgColor]
      properties:
        name:
          type: string
          example: Adventure
        icon:
          type: string
          example: Mountain
        color:
          type: string
          example: "#ea580c"
        bgColor:
          type: string
          example: "#fff7ed"
        darkColor:
          type: string
          example: "#fdba74"
        darkBgColor:
          type: string
          example: "#431407"

security:
  - BearerAuth: []

paths:
  paths:
  # ==========================================
  # 🔐 Authentication & User Management
  # ==========================================
  /api/auth/register:
    post:
      summary: Create a new user account
      tags: [Authentication]
      security: [] 
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterInput'
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        400:
          description: Invalid input / email already exists

  /api/auth/login:
    post:
      summary: Authenticate user and return a JWT token
      tags: [Authentication]
      security: [] 
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginInput'
      responses:
        200:
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        401:
          description: Invalid credentials

  /api/auth/demo-login:
    post:
      summary: Sign in as a seeded demo or admin account
      description: |
        Logs in as a fixed demo account, creating it on first use if it doesn't exist yet.
        The `admin` role is only available when `NEXT_PUBLIC_APP_ENV=development` —
        requesting it otherwise (including when the var is unset) returns 403 regardless
        of the `role` value sent.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [demo, admin]
      responses:
        200:
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        400:
          description: Missing/invalid role
        403:
          description: Admin quick-login requested outside a non-production environment
        500:
          description: Demo account env vars not configured

  /api/auth/forgot-password:
    post:
      summary: Request a password-reset email
      description: |
        Always returns the same generic success message, whether or not the email
        belongs to a registered account — this endpoint never reveals which emails
        are registered. If the account exists, a time-limited (1 hour) reset link is
        emailed via Resend.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        200:
          description: Generic confirmation (see description)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        400:
          description: Missing email

  /api/auth/reset-password:
    post:
      summary: Set a new password using a reset token
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                  description: Raw reset token from the emailed link's `?token=` query param
                newPassword:
                  type: string
                  minLength: 8
      responses:
        200:
          description: Password updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        400:
          description: |
            Invalid input, or an invalid/expired token — check the `code` field
            (`INVALID_TOKEN`) to distinguish a bad token from a plain validation error.

  /api/users/search:
    get:
      summary: Search registered users by name or email
      description: Returns up to 10 users matching the query. Excludes the authenticated caller. Requires at least 2 characters.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
          description: Search term matched against name and email (case-insensitive)
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                    name:
                      type: string
                    email:
                      type: string
        "401":
          description: Unauthorized

  /api/users/me:
    get:
      summary: Fetch the authenticated user's profile details
      tags: [Authentication]
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        401:
          description: Unauthorized
    put:
      summary: Update profile info
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateInput'
      responses:
        200:
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'

  /api/users/me/visited/{attractionId}:
    put:
      summary: Mark an attraction as personally visited (idempotent)
      tags: [Authentication]
      parameters:
        - name: attractionId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Marked visited
          content:
            application/json:
              schema:
                type: object
                properties:
                  isVisited: { type: boolean, example: true }
        401:
          description: Unauthorized
    delete:
      summary: Unmark an attraction as personally visited (idempotent)
      tags: [Authentication]
      parameters:
        - name: attractionId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Unmarked visited
          content:
            application/json:
              schema:
                type: object
                properties:
                  isVisited: { type: boolean, example: false }
        401:
          description: Unauthorized

  /api/fx:
    get:
      summary: Get live exchange rate between two currencies
      tags: [Utilities]
      security: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            default: USD
          description: Source currency code (e.g. USD, EUR, JPY). Defaults to USD.
        - name: to
          in: query
          required: false
          schema:
            type: string
            default: ILS
          description: Target currency code (e.g. ILS, EUR, GBP). Defaults to ILS.
      responses:
        200:
          description: Exchange rate from `from` to `to`
          content:
            application/json:
              schema:
                type: object
                properties:
                  rate: { type: number, example: 3.72 }
        404:
          description: No rate available for the given currency pair
        502:
          description: Upstream exchange rate service unavailable

  /api/users/me/password:
    patch:
      summary: Change the authenticated user's password
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  description: The user's existing password for verification
                newPassword:
                  type: string
                  minLength: 8
                  description: The new password (minimum 8 characters)
      responses:
        200:
          description: Password updated successfully
        400:
          description: Missing fields or new password too short
        401:
          description: Unauthorized or current password incorrect

  # ==========================================
  # 🗺️ Trip Management
  # ==========================================
  /api/trips:
    get:
      summary: Retrieve all trips for the logged-in user (owned + shared as collaborator)
      tags: [Trips]
      parameters:
        - name: upcoming
          in: query
          schema:
            type: boolean
          description: Filter where startDate > today
        - name: country
          in: query
          schema:
            type: string
          description: Filter by country name
        - name: mood
          in: query
          schema:
            type: string
          description: Filter by trip mood tags
      responses:
        200:
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
    post:
      summary: Create a new trip
      tags: [Trips]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripInput'
      responses:
        201:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'

  /api/trips/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a specific trip's details
      description: |
        Auth is optional. Public trips are readable without a token.
        If the trip exists but is private and the caller is neither the owner nor a collaborator, returns 403.
        Returns 404 only when the trip ID does not exist at all.
      tags: [Trips]
      security: []
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        403:
          description: Trip is private and caller is not the owner or a collaborator
        404:
          description: Trip not found
    put:
      summary: Update trip details (owner or collaborator; isPrivate settable by either)
      tags: [Trips]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripInput'
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
    delete:
      summary: Delete a trip
      tags: [Trips]
      responses:
        200:
          description: Trip successfully deleted

  /api/trips/{id}/collaborators:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Add a collaborator to a trip (owner only)
      tags: [Trips]
      description: Looks up the user by email and appends them to the trip's collaborators list. Returns the updated Trip.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: jane@example.com
      responses:
        201:
          description: Collaborator added; returns updated trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        400:
          description: Missing email or trying to add yourself
        404:
          description: Trip not found or user with that email not found
        409:
          description: User is already a collaborator

  /api/trips/{id}/collaborators/{userId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Remove a collaborator from a trip (owner only)
      tags: [Trips]
      description: Removes the collaborator identified by userId from the trip. Returns the updated Trip.
      responses:
        200:
          description: Collaborator removed; returns updated trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        404:
          description: Trip not found or collaborator not found

  # ==========================================
  # 🏛️ Attraction Management (Nested Routes)
  # ==========================================
  /api/trips/{id}/attractions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get all attractions for a specific trip
      description: Auth is optional. Returns attractions for public trips without a token; private trips return [].
      tags: [Attractions]
      security: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
          description: Filter by type (e.g. Restaurant)
        - name: sort
          in: query
          schema:
            type: string
          description: Sort field (e.g. price)
      responses:
        200:
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attraction'
    post:
      summary: Add a new attraction to a trip
      tags: [Attractions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttractionInput'
      responses:
        201:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attraction'

  /api/attractions:
    get:
      summary: Search public attractions by country, city, or attraction type
      tags: [Attractions]
      security: []
      parameters:
        - name: country
          in: query
          required: false
          schema:
            type: string
          description: Filter by country. One of country, city, or type is required.
        - name: city
          in: query
          required: false
          schema:
            type: string
          description: Filter by city. One of country, city, or type is required. Returns up to 100 results.
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Text search on attraction name (case-insensitive regex).
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: Filter by attraction type name. Satisfies the country/city requirement on its own (e.g. for a category drill-down list). Returns up to 200 results.
        - name: ownerId
          in: query
          required: false
          schema:
            type: string
          description: Scope results to attractions created by this user (and exclude flights), matching the personal category-distribution analytics for that user.
        - name: skip
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Pagination offset.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Page size — capped at the default per-query-shape limit (20 for a bare country search, 100 for a city search, 200 for a type search); cannot request more than that cap.
      responses:
        '200':
          description: |
            Array of matching attractions for this page. Total result count, offset, and page
            size are returned as the `X-Total-Count`, `X-Skip`, and `X-Limit` response headers
            (the body stays a plain array for backward compatibility).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attraction'
        '400':
          description: Missing required params (country, city, or type)
        '500':
          description: Internal server error
    post:
      summary: Create a new attraction globally
      tags: [Attractions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttractionInput'
      responses:
        '201':
          description: Created attraction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attraction'
        '400':
          description: Missing required fields
        '409':
          description: Attraction with this name already exists

  /api/attractions/cities:
    get:
      summary: List cities that have public attractions with coordinates
      description: >
        Works without a token (security: [] — same optional-auth pattern as GET
        /api/attractions). When a valid token IS supplied, visitedCount/unvisitedCount
        and usedInTripCount/notUsedInTripCount are computed for that caller; an
        anonymous or unauthenticated request always gets visitedCount: 0 and
        usedInTripCount: 0 for every city (unvisitedCount/notUsedInTripCount then equal
        count).
      tags: [Attractions]
      security: []
      responses:
        '200':
          description: City list with centroid coordinates and attraction counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  cities:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: Budapest
                        country:
                          type: string
                          example: Hungary
                        lat:
                          type: number
                          example: 47.4979
                        lng:
                          type: number
                          example: 19.0402
                        count:
                          type: integer
                          example: 12
                        visitedCount:
                          type: integer
                          example: 3
                          description: How many of this city's attractions the requesting user has marked visited.
                        unvisitedCount:
                          type: integer
                          example: 9
                        usedInTripCount:
                          type: integer
                          example: 2
                          description: How many of this city's attractions already appear in one of the requesting user's own trips.
                        notUsedInTripCount:
                          type: integer
                          example: 10
        '500':
          description: Internal server error

  /api/attractions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Update an attraction's specific details
      description: >
        parentAttractionId: omit the key to leave the existing parent link untouched, send
        null to clear it (last-inherited coordinates/city/country are left in place), or
        send an id to (re)set it — same inheritance/validation as POST. Rejects with 400 if
        this attraction already has its own children (would create two levels of nesting).
      tags: [Attractions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttractionInput'
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attraction'
        '400':
          description: >
            Invalid parentAttractionId (not found, country mismatch, chosen parent is
            itself a child, or this attraction already has its own children).
        '409':
          description: >
            Another attraction already has this name at the same coordinates. Renaming to a
            name already used by an attraction at different coordinates is allowed.
    delete:
      summary: Delete an attraction globally
      tags: [Attractions]
      responses:
        200:
          description: Attraction deleted
        '409':
          description: >
            This attraction still has one or more children nested inside it — remove or
            reassign them first.

  /api/trips/{id}/attractions/{attractionId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: attractionId
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Unlink attraction from this trip (does NOT delete the global Attraction document)
      tags: [Attractions]
      responses:
        200:
          description: Removed from itinerary
    patch:
      summary: Update trip-specific schedule for one attraction (plannedDate, plannedTime, actualDuration)
      tags: [Attractions]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttractionSchedule'
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attraction'

  /api/trips/{id}/reorder-attractions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Reorders attractions within a trip
      tags: [Attractions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderInput'
      responses:
        200:
          description: Order updated successfully

  /api/trips/{id}/swap-days:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Swaps everything scheduled between two days of a trip
      description: >
        Every schedule entry (regular attraction instances, custom time-slots, flights)
        with plannedDate === dayA moves to dayB and vice versa — plannedTime and every
        other field on each entry are untouched, so the same times of day just apply to
        the other date. Entries on neither day are untouched. A no-op (still 200) if
        nothing is scheduled on either day.
      tags: [Trips]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dayA, dayB]
              properties:
                dayA:
                  type: string
                  format: date
                  example: "2026-06-01"
                dayB:
                  type: string
                  format: date
                  example: "2026-06-03"
      responses:
        200:
          description: Days swapped
        '400':
          description: dayA/dayB missing or identical
        '404':
          description: Trip not found (or caller lacks access)

  # ==========================================
  # 🌍 Explore
  # ==========================================
  /api/explore:
    get:
      summary: Discover public trips for the Explore page
      description: |
        Returns public trips that have a cover image, sorted by most recent (24 per page
        by default). Private trips are never included — no authentication is required or accepted.
      tags: [Explore]
      security: []
      parameters:
        - name: skip
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Pagination offset.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 24
            maximum: 100
          description: Page size (max 100).
      responses:
        200:
          description: |
            Page of explore items. Total result count, offset, and page size are returned as
            the `X-Total-Count`, `X-Skip`, and `X-Limit` response headers.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: 65f1234567890abcdef123aa
                    destination:
                      type: string
                      example: Summer in Rome
                    country:
                      type: string
                      example: Italy
                    coverImage:
                      type: string
                      example: https://images.unsplash.com/photo-xxx
                    tag:
                      type: string
                      example: Adventure
                    tags:
                      type: array
                      items:
                        type: string
                      example: ["Adventure", "Food & Wine"]
                    user:
                      type: string
                      description: First 8 characters of the owner's userId
                      example: 65f12345
                    likes:
                      type: integer
                      description: Number of attractions in the trip
                      example: 5
                    cities:
                      type: array
                      items:
                        type: string
                      description: Deduplicated, alphabetically sorted city names from the trip's attractions
                      example: ["Florence", "Rome", "Venice"]
        500:
          description: Internal server error

  # ==========================================
  # 📊 Analytics
  # ==========================================
  /api/analytics/global:
    get:
      summary: Get system-wide global metrics
      tags: [Analytics]
      security: [] 
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalAnalytics'

  /api/analytics/summary:
    get:
      summary: Get personalized user analytics and travel spend summaries
      tags: [Analytics]
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalAnalytics'

  # ==========================================
  # 🔖 Attraction Types
  # ==========================================
  /api/attraction-types:
    get:
      summary: List all attraction types (with populated category data)
      tags: [Attraction Types]
      security: []
      responses:
        200:
          description: Array of attraction types sorted alphabetically by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttractionType'
        500:
          description: Internal server error
    post:
      summary: Create an attraction type (admin only)
      tags: [Attraction Types]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttractionTypeInput'
      responses:
        201:
          description: Created attraction type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttractionType'
        400:
          description: Validation error or duplicate name
        401:
          description: Unauthorized
        403:
          description: Forbidden — admin only

  /api/attraction-types/{id}:
    put:
      summary: Update an attraction type (admin only)
      tags: [Attraction Types]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttractionTypeInput'
      responses:
        200:
          description: Updated attraction type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttractionType'
        400:
          description: Validation error or duplicate name
        401:
          description: Unauthorized
        403:
          description: Forbidden — admin only
        404:
          description: Attraction type not found
    delete:
      summary: Delete an attraction type (admin only)
      tags: [Attraction Types]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Deletion confirmed; type also removed from all attractions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        401:
          description: Unauthorized
        403:
          description: Forbidden — admin only
        404:
          description: Attraction type not found

  # ==========================================
  # 📂 Attraction Categories
  # ==========================================
  /api/attraction-categories:
    get:
      summary: List all attraction categories
      tags: [Attraction Categories]
      security: []
      responses:
        200:
          description: Array of categories sorted alphabetically by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttractionCategory'
        500:
          description: Internal server error
    post:
      summary: Create an attraction category (admin only)
      tags: [Attraction Categories]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttractionCategoryInput'
      responses:
        201:
          description: Created category
          content:
